name: Generate Go Code from Proto Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Generated Repo
        uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler golang-goprotobuf-dev

      - name: Install Go Protoc Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Clone Proto Files Repository
        run: |
          git clone https://github.com/medinanurbek/protos-reprository.git protos

      - name: Generate Go Code from Proto Files
        run: |
          mkdir -p go
          protoc --proto_path=protos/proto \
            --go_out=go --go_opt=paths=source_relative \
            --go-grpc_out=go --go-grpc_opt=paths=source_relative \
            payment/payment.proto \
            order/order.proto

      - name: Push to Generated Repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.email "medinanurbek@example.com"
          git config --global user.name "medinanurbek"
          git add .
          git commit -m "chore: generate code from proto" || echo "No changes to commit"
          git push origin main
