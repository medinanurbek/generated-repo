name: Generate Go Code from Proto Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Generated Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler golang-goprotobuf-dev

      - name: Install Go Protoc Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Clone Proto Files Repository
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Используем PAT для клонирования, если репозиторий приватный
          git clone https://${PAT_TOKEN}@github.com/medinanurbek/proto-repo.git protos

      - name: Generate Go Code from Proto Files
        run: |
          mkdir -p go
          protoc --proto_path=protos/proto \
            --go_out=go --go_opt=paths=source_relative \
            --go-grpc_out=go --go-grpc_opt=paths=source_relative \
            protos/proto/payment/payment.proto \
            protos/proto/order/order.proto

      - name: Push to Generated Repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "chore: generate code from proto" || echo "No changes to commit"
          git push origin main
